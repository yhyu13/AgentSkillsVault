# agent-gate 配置：把治理面路径、共享正本目录、默认 issue 抽出来，
# 使 pr-grade.sh / check-refs.py 与具体项目无关（换项目只改这个文件）。

# 1) 治理面文件：改动即视为红级（FR-605-1），需 admin 账号批准并执行合并。
GOV_PATHS_RE='^(AGENTS\.md|scripts/pre-merge-check\.sh|scripts/new-slice\.sh|\.github/.*)$'

# 2) 共享正本目录：这些目录默认只读；要写必须在 issue 的切片表里登记为独占。
SHARED_ORIGIN_RE='^(docs/research/|specs/0.*)$'

# 3) PR 正文没写 Refs: #N 时的兜底 issue 号（本仓默认治理 issue）。
DEFAULT_ISSUE=1

# 4) 切片分支前缀与工作树目录名（默认 feat/<slice> 与 wt/<slice>）。
BRANCH_PREFIX=feat
WORKTREE_DIR=wt
