<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>PBR Scene Blank</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.20.0/dist/lil-gui.esm.js"
    }
  }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import GUI from 'lil-gui';

    // ============ 👈 SCENE CONFIG ============
    const SCENE = { backgroundColor: 0x0a0a0a };
    // ========================================

    // ============ 👈 CAMERA CONFIG ============
    const CAMERA = { fov: 50, position: [5, 4, 7], target: [0, 0, 0] };
    // ========================================

    // ============ 👈 POST CONFIG ============
    const POST = { bloomStrength: 0.3, bloomRadius: 0.5, bloomThreshold: 0.9, exposure: 1.0 };
    // ========================================

    // ---- Boilerplate (don't touch) ----
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = POST.exposure;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(SCENE.backgroundColor);

    const camera = new THREE.PerspectiveCamera(CAMERA.fov, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(...CAMERA.position);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(...CAMERA.target);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.update();

    new RGBELoader().load(
      'https://dl.polyhaven.org/file.php?id=studio_small_03_1k&format=hdr',
      (hdr) => {
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromEquirectangular(hdr).texture;
        hdr.dispose(); pmrem.dispose();
      }
    );

    const key = new THREE.DirectionalLight(0xffffff, 2.5);
    key.position.set(5, 8, 4);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    scene.add(key);
    scene.add(new THREE.AmbientLight(0xffffff, 0.2));

    // ============ 👈 YOUR CODE GOES HERE ============
    // 把你自己的物体/几何/材质加到这里
    // 例:
    // const box = new THREE.Mesh(
    //   new THREE.BoxGeometry(1, 1, 1),
    //   new THREE.MeshPhysicalMaterial({ color: 0xff6644, metalness: 0.9, roughness: 0.2, clearcoat: 1.0 })
    // );
    // box.castShadow = true;
    // scene.add(box);
    // ===============================================

    // ---- Post ----
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    composer.addPass(new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      POST.bloomStrength, POST.bloomRadius, POST.bloomThreshold
    ));
    composer.addPass(new OutputPass());

    // ---- GUI ----
    const gui = new GUI({ title: 'Controls' });
    const fPost = gui.addFolder('Post');
    fPost.add(POST, 'bloomStrength', 0, 3, 0.05).onChange(v => { /* bloom ref needed */ });
    fPost.add(POST, 'exposure', 0.1, 3, 0.05).onChange(v => renderer.toneMappingExposure = v);

    // ---- Resize ----
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---- Loop ----
    (function animate() {
      controls.update();
      composer.render();
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
